<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>勉強タイマー</title>
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="勉強タイマー">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1f2937;--sub:#6b7280;--study:#2563eb;--rest:#16a34a;--line:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--card:#1f2937;--text:#f3f4f6;--sub:#9ca3af;--study:#60a5fa;--rest:#4ade80;--line:#374151;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--sub:#9ca3af;--study:#60a5fa;--rest:#4ade80;--line:#374151;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;justify-content:center;padding:16px}
.wrap{width:100%;max-width:440px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;background:var(--card);color:var(--sub);border:1px solid var(--line)}
.tabs button.on{background:var(--study);color:#fff;border-color:var(--study)}
.card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px}
.phase{text-align:center;font-weight:700;color:var(--study)}
.phase.rest{color:var(--rest)}
.time{text-align:center;font-size:60px;font-weight:700;font-variant-numeric:tabular-nums;margin:6px 0}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
.bar>div{height:100%;width:0;background:var(--study)}
.bar.rest>div{background:var(--rest)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:15px;padding:11px;border:0;border-radius:10px;cursor:pointer;background:var(--study);color:#fff;font-weight:600;flex:1}
button.sec{background:var(--line);color:var(--text)}
button.sm{font-size:13px;padding:8px;font-weight:500}
.info{font-size:13px;color:var(--sub);text-align:center;margin-top:10px}
fieldset{border:0;margin:0;padding:0;min-width:0}
.step{display:flex;align-items:center;gap:6px;margin-bottom:8px;padding:8px;border-radius:10px;border-left:4px solid var(--study);background:var(--bg);font-size:14px}
.step.rest{border-left-color:var(--rest)}
.step.workout{border-left-color:#f97316}
.phase.workout{color:#f97316}
.bar.workout>div{background:#f97316}
.step{flex-wrap:nowrap}
.step .n{flex:0 0 14px;width:14px}
.step select{flex:0 0 auto;font-size:14px;padding:6px 2px}
.step input[type=number]{flex:1 1 38px;width:auto;min-width:0;max-width:60px;padding:6px 2px;text-align:center;font-size:16px}
.step .u{font-size:13px;color:var(--sub)}
.acts{margin-left:auto;display:flex;gap:2px;flex:0 0 auto}
.acts .mv,.acts .x{flex:0 0 28px;width:28px;padding:6px 0}
@media(max-width:420px){.card{padding:14px}.step{gap:3px;padding:6px}}
.mv{flex:0 0 30px;padding:6px 0;background:var(--line);color:var(--text);font-size:12px;font-weight:400}
.step.now{outline:2px solid var(--text)}
.step .n{width:18px;color:var(--sub);font-size:12px}
select,input[type=number]{font:inherit;font-size:15px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
input[type=number]{width:54px}
.x{flex:0 0 32px;padding:6px;background:transparent;color:var(--sub);font-weight:400}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:8px 0}
.chk input{width:18px;height:18px}
.long{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;margin:4px 0 0 26px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;color:var(--sub);text-align:center}
.cal .d{min-height:52px;border-radius:8px;border:1px solid var(--line);padding:3px;font-size:11px;cursor:pointer;overflow:hidden;background:var(--bg)}
.cal .d b{display:block;font-size:12px}
.cal .d.today{border:2px solid var(--text)}
.cal .d.sel{outline:2px solid var(--study)}
.cal .e{border:0;background:transparent;cursor:default}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mh button{flex:0 0 44px}
.mh span{font-weight:700}
.sum{display:flex;gap:8px;text-align:center}
.sum>div{flex:1;background:var(--bg);border-radius:10px;padding:8px}
.sum small{display:block;color:var(--sub);font-size:12px}
.sum b{font-size:15px}
.fr{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;padding:8px;border-radius:10px;background:var(--bg);border-left:4px solid var(--rest)}
.fr.out{border-left-color:#f97316}
.fr input{font:inherit;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);min-width:0}
.fr .nm{flex:1 1 140px}.fr .ex{flex:1 1 100px}.fr select{flex:0 1 auto;max-width:45%;font-size:16px;padding:8px 4px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
.fr .mv{flex:0 0 44px}
.fr .res{flex:1 1 100%;font-size:13px;color:var(--sub);text-align:right}
textarea#memo{width:100%;margin-top:10px;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);resize:vertical}
.cal .d.memo b::after{content:" ✎";font-weight:400;color:var(--sub)}
.gs{padding:8px 10px;border-radius:10px;background:var(--bg);margin-bottom:8px}
.gh{display:flex;align-items:center;gap:8px}
.gh .need{margin-left:auto;font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
.gd{font-size:12px;color:var(--sub);margin-top:2px}
.grow{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.grow .gdot{flex:0 0 32px;width:32px;height:32px;border-radius:50%;padding:0;border:2px solid var(--line)}
.grow input{flex:1;min-width:0;font:inherit;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.grow .x{flex:0 0 32px}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-200%);background:var(--text);color:var(--bg);padding:14px 20px;border-radius:12px;font-weight:600;transition:transform .3s;z-index:10;max-width:90%;text-align:center}
#toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs"><button id="tT" class="on">⏱ タイマー</button><button id="tR">📅 記録</button><button id="tF">💰 家計</button></div>

  <div id="pT">
    <div class="card">
      <div class="phase" id="phase">待機中</div>
      <div class="time" id="time">25:00</div>
      <div class="bar" id="bar"><div id="fill"></div></div>
      <div class="btns">
        <button id="start">開始</button>
        <button class="sec" id="skip">スキップ</button>
        <button class="sec" id="reset">リセット</button>
      </div>
      <div class="info" id="info"></div>
    </div>

    <div class="card">
      <h2>セット内容(上から順に実行)</h2>
      <fieldset id="fs">
        <div id="steps"></div>
        <div class="btns" style="margin-bottom:12px">
          <button class="sec sm" id="addS">＋ 勉強</button>
          <button class="sec sm" id="addR">＋ 休憩</button>
        </div>
        <label class="chk"><input type="checkbox" id="repeat">最後まで行ったら最初から繰り返す</label>
        <label class="chk"><input type="checkbox" id="longOn">一定回数ごとに長い休憩を入れる</label>
        <div class="long" id="longRow">勉強<input type="number" id="longN" min="1">回ごとに
          <input type="number" id="longM" min="0"><span class="u">分</span><input type="number" id="longS" min="0" max="59">秒休む</div>
      </fieldset>
    </div>
  </div>

  <div id="pR" hidden>
    <div class="card">
      <div class="mh"><button class="sec" id="pm">◀</button><span id="mt"></span><button class="sec" id="nm">▶</button></div>
      <div class="cal" id="cal"></div>
      <div class="info" id="mtot"></div><div class="info" id="mfin"></div>
    </div>
    <div class="card"><h2 id="dt"></h2><div id="dd" style="font-size:22px;font-weight:700"></div><div id="dw" class="info" style="text-align:left"></div><textarea id="memo" rows="4" placeholder="この日のメモ(勉強内容・振り返りなど)"></textarea></div>
  </div>
  <div id="pF" hidden>
    <div class="card">
      <div class="mh"><button class="sec" id="fpm">◀</button><span id="fmt"></span><button class="sec" id="fnm">▶</button></div>
      <div class="sum"><div><small>収入</small><b id="s_in"></b></div><div><small>支出</small><b id="s_out"></b></div><div><small>収支</small><b id="s_bal"></b></div></div>
    </div>
    <div class="card"><h2>🏦 グループ別の入金額(支出−収入)</h2><div id="grpSum"></div></div>
    <div class="card"><h2>💴 収入(お小遣い・支援・給料など)</h2><div id="fin_in_l"></div><button class="sec sm" style="width:100%" data-add="in">＋ 収入を追加</button></div>
    <div class="card"><h2>💳 支出(カード・現金・固定費など)</h2><div id="fin_out_l"></div><button class="sec sm" style="width:100%" data-add="out">＋ 支出を追加</button></div>
    <div class="card"><h2>🎨 グループの設定</h2><div id="grpList"></div><button class="sec sm" style="width:100%" data-gadd="1">＋ グループを追加</button>
      <div class="info">色の丸をタップすると色が変わります。名前は銀行名などに自由に変えられます。</div></div>
    <div class="card"><button class="sec sm" id="fcopy" style="width:100%">先月の項目をコピー</button>
      <div class="info">金額欄は計算式が使えます(例: 12800/2 なら自分の分だけ)。「÷2」ボタンでも割れます。項目名は一度入力すると候補に出ます。</div></div>
    <datalist id="fnames"></datalist>
  </div>
</div>
<div id="toast"></div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
function load(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

var cfg=load('st_cfg_v3')||{steps:[{t:'study',m:50,s:0},{t:'rest',m:10,s:0}],repeat:false,longOn:false,longN:4,longM:15,longS:0};
var rec=load('st_rec_v2')||{};
var running=false,started=false,idx=0,curStep=null,pendStep=null,cur=null,endAt=0,total=0,remainMs=0,lastT=0,tick=null,pending=-1,studyDone=0,audioCtx=null,lastSave=0;

function dur(m,s){return Math.max(1,(m||0)*60+(s||0))*1000}
function fmt(ms){var s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function longD(sec){sec=Math.round(sec);var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  if(h>0)return h+'時間'+m+'分';if(m>0)return m+'分'+s+'秒';return s+'秒'}
function shortD(sec){sec=Math.round(sec);var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);
  if(h>0)return h+'h'+m+'m';if(m>0)return m+'m';return sec+'s'}

/* ---------- 通知 ---------- */
function beep(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  [0,.25,.5].forEach(function(t){var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;
  o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.2,audioCtx.currentTime+t);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+t+.2);o.start(audioCtx.currentTime+t);o.stop(audioCtx.currentTime+t+.2)})}catch(e){}}
function notify(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},5000);beep();
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
  try{if('Notification' in window&&Notification.permission==='granted')new Notification('勉強タイマー',{body:msg})}catch(e){}}

/* ---------- セット編集 ---------- */
function fixIdx(oi){if(!started||!curStep)return;var j=cfg.steps.indexOf(curStep);idx=j>=0?j:Math.max(-1,oi-1)}
function saveCfg(){save('st_cfg_v3',cfg)}
function renderSteps(){
  $('steps').innerHTML=cfg.steps.map(function(st,i){
    return '<div class="step '+st.t+(started&&cur&&!cur.long&&i===idx?' now':'')+'"><span class="n">'+(i+1)+'</span>'+
    '<select data-i="'+i+'" data-f="t"><option value="study"'+(st.t==='study'?' selected':'')+'>勉強</option><option value="rest"'+(st.t==='rest'?' selected':'')+'>休憩</option><option value="workout"'+(st.t==='workout'?' selected':'')+'>筋トレ</option></select>'+
    '<input type="number" min="0" data-i="'+i+'" data-f="m" value="'+st.m+'">分<input type="number" min="0" max="59" data-i="'+i+'" data-f="s" value="'+st.s+'"><span class="u">秒</span>'+
    '<div class="acts"><button class="mv" data-up="'+i+'"'+(i===0?' disabled':'')+'>▲</button><button class="mv" data-dn="'+i+'"'+(i===cfg.steps.length-1?' disabled':'')+'>▼</button>'+
    '<button class="x" data-del="'+i+'">✕</button></div></div>'}).join('');
}
function idleView(){if(!started){var f=cfg.steps[0];$('time').textContent=f?fmt(dur(f.m,f.s)):'00:00';
  $('info').textContent=started?'':'今日の学習: '+longD(rec[dayKey()]||0)}}
$('steps').addEventListener('input',function(e){var d=e.target.dataset;if(d.f==null)return;var st=cfg.steps[+d.i];
  st[d.f]=d.f==='t'?e.target.value:Math.max(0,parseInt(e.target.value,10)||0);
  if(d.f==='t'){renderSteps()}saveCfg();idleView()});
$('steps').addEventListener('click',function(e){var ds=e.target.dataset,a=cfg.steps,oi=idx;
  if(ds.up!=null){var i=+ds.up;if(i>0){var t=a[i-1];a[i-1]=a[i];a[i]=t}}
  else if(ds.dn!=null){var j=+ds.dn;if(j<a.length-1){var u=a[j+1];a[j+1]=a[j];a[j]=u}}
  else if(ds.del!=null){if(a.length>1)a.splice(+ds.del,1);else return}
  else return;
  fixIdx(oi);saveCfg();renderSteps();idleView()});
$('addS').onclick=function(){cfg.steps.push({t:'study',m:25,s:0});saveCfg();renderSteps()};
$('addR').onclick=function(){cfg.steps.push({t:'rest',m:5,s:0});saveCfg();renderSteps()};
function bindOpts(){$('repeat').checked=cfg.repeat;$('longOn').checked=cfg.longOn;$('longN').value=cfg.longN;$('longM').value=cfg.longM;$('longS').value=cfg.longS;updLong()}
function updLong(){$('longRow').style.opacity=cfg.longOn?1:.35;['longN','longM','longS'].forEach(function(i){$(i).disabled=!cfg.longOn})}
['repeat','longOn'].forEach(function(id){$(id).onchange=function(){cfg[id]=$(id).checked;saveCfg();updLong()}});
['longN','longM','longS'].forEach(function(id){$(id).oninput=function(){cfg[id]=Math.max(0,parseInt($(id).value,10)||0);saveCfg()}});

/* ---------- タイマー本体 ---------- */
function setPhase(type,label){$('phase').textContent=label;var c=type==='rest'?' rest':type==='workout'?' workout':'';$('phase').className='phase'+c;$('bar').className='bar'+c}
function startCur(type,ms,isLong,label){cur={type:type,long:isLong};total=ms;endAt=Date.now()+ms;lastT=Date.now();setPhase(type,label);renderSteps();render()}
function runStep(n){idx=n;var st=cfg.steps[n];curStep=st;
  startCur(st.t,dur(st.m,st.s),false,(st.t==='study'?'📖 勉強中':st.t==='workout'?'💪 筋トレ中':'☕ 休憩中')+'(ステップ '+(n+1)+'/'+cfg.steps.length+')')}
function nextAfter(n,long){
  if(n>=cfg.steps.length)n=cfg.repeat?0:-1;
  if(long){pending=n;pendStep=cfg.steps[n]||null;startCur('rest',dur(cfg.longM,cfg.longS),true,'🌿 長い休憩中');return}
  if(n<0){stopAll(true);return}
  runStep(n);
}
function finish(){
  addRec();
  var wasStudy=cur.type==='study'&&!cur.long;
  if(cur.long){var p=pendStep?cfg.steps.indexOf(pendStep):-1;notify('長い休憩終了!');nextAfter(p<0?cfg.steps.length:p,false);return}
  var n=idx+1,long=false;
  if(wasStudy){studyDone++;if(cfg.longOn&&cfg.longN>0&&studyDone%cfg.longN===0){long=true;if(n<cfg.steps.length&&cfg.steps[n].t==='rest')n++}}
  var next=n>=cfg.steps.length?(cfg.repeat?0:-1):n;
  if(long)notify('勉強'+studyDone+'回達成!長い休憩です('+longD(dur(cfg.longM,cfg.longS)/1000)+')');
  else if(next<0)notify('すべて終了!お疲れさまでした。');
  else{var s=cfg.steps[next];notify((s.t==='rest'?'休憩の時間です(':s.t==='workout'?'筋トレを始めましょう(':'勉強を始めましょう(')+longD(dur(s.m,s.s)/1000)+')')}
  nextAfter(n,long);
}
function addRec(){var now=Date.now();if(cur&&(cur.type==='study'||cur.type==='workout')&&lastT){var up=Math.min(now,endAt),d=(up-lastT)/1000;
  if(d>0){var k=(cur.type==='workout'?'w:':'')+dayKey();rec[k]=(rec[k]||0)+d}}lastT=now;
  if(now-lastSave>5000){save('st_rec_v2',rec);lastSave=now}}
function render(){var left=endAt-Date.now();$('time').textContent=fmt(left);
  $('fill').style.width=Math.min(100,Math.max(0,(1-left/total)*100))+'%';
  document.title=(running?fmt(left)+' ':'')+'勉強タイマー';
  $('info').textContent='今日の学習: '+longD(rec[dayKey()]||0)+'/勉強回数: '+studyDone}
function loop(){if(!running)return;addRec();render();if(endAt-Date.now()<=0)finish()}
function stopAll(done){running=false;started=false;clearInterval(tick);addRec();save('st_rec_v2',rec);cur=null;
  setPhase('idle','待機中');$('fill').style.width='0';$('start').textContent='開始';$('fs').disabled=false;
  document.title='勉強タイマー';renderSteps();idleView();if(done)$('info').textContent='完了!今日の学習: '+longD(rec[dayKey()]||0)}
$('start').onclick=function(){
  if(!running){
    try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}
    try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch(e){}
    running=true;$('fs').disabled=true;
    if(!started){started=true;studyDone=0;runStep(0)}else{endAt=Date.now()+remainMs;lastT=Date.now()}
    $('start').textContent='一時停止';tick=setInterval(loop,250);
  }else{addRec();running=false;clearInterval(tick);remainMs=endAt-Date.now();save('st_rec_v2',rec);$('start').textContent='再開';$('fs').disabled=false}
};
$('skip').onclick=function(){if(started){addRec();if(!running){running=true;$('fs').disabled=true;tick=setInterval(loop,250);$('start').textContent='一時停止'}endAt=Date.now();finish()}};
$('reset').onclick=function(){stopAll(false)};

/* ---------- 記録(カレンダー) ---------- */
var vy=new Date().getFullYear(),vm=new Date().getMonth(),sel=dayKey();
function renderCal(){
  $('mt').textContent=vy+'年'+(vm+1)+'月';
  var days=new Date(vy,vm+1,0).getDate(),first=new Date(vy,vm,1).getDay(),h='',tot=0,td=dayKey();
  '日月火水木金土'.split('').forEach(function(w){h+='<div class="h">'+w+'</div>'});
  for(var i=0;i<first;i++)h+='<div class="d e"></div>';
  for(var d=1;d<=days;d++){var k=vy+'-'+String(vm+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),s=rec[k]||0;tot+=s;
    var a=s>0?Math.min(70,15+s/3600*20):0;
    h+='<div class="d'+(k===td?' today':'')+(k===sel?' sel':'')+(memo[k]?' memo':'')+'" data-k="'+k+'" style="background:'+(a?'color-mix(in srgb,var(--study) '+a+'%,transparent)':'var(--bg)')+'"><b>'+d+'</b>'+(s>0?shortD(s):'')+'</div>'}
  $('cal').innerHTML=h;$('mtot').textContent='今月の勉強合計: '+longD(tot);var ft=finTotals(mk(vy,vm));$('mfin').textContent=(fin[mk(vy,vm)]||[]).length?'💰 収入 '+yen(ft.i)+' / 支出 '+yen(ft.o)+' / 収支 '+yen(ft.i-ft.o):'';showDay();
}
function showDay(){var p=sel.split('-');$('dt').textContent=(+p[1])+'月'+(+p[2])+'日の学習時間';$('dd').textContent=(rec[sel]||0)>0?longD(rec[sel]):'記録なし';var w=rec['w:'+sel]||0;$('dw').textContent=w>0?'💪 筋トレ: '+longD(w):'';$('memo').value=memo[sel]||''}
$('cal').onclick=function(e){var el=e.target.closest('.d');if(el&&el.dataset.k){sel=el.dataset.k;renderCal()}};
$('pm').onclick=function(){vm--;if(vm<0){vm=11;vy--}renderCal()};
$('nm').onclick=function(){vm++;if(vm>11){vm=0;vy++}renderCal()};
function tab(n){['T','R','F'].forEach(function(k){$('p'+k).hidden=k!==n;$('t'+k).className=k===n?'on':''});
  if(n==='R'){save('st_rec_v2',rec);renderCal()}if(n==='F')renderFin()}
$('tT').onclick=function(){tab('T')};$('tR').onclick=function(){tab('R')};$('tF').onclick=function(){tab('F')};
window.addEventListener('pagehide',function(){save('st_rec_v2',rec)});

/* ---------- メモ ---------- */
var memo=load('st_memo_v1')||{};
$('memo').addEventListener('input',function(){var v=$('memo').value;if(v.trim())memo[sel]=v;else delete memo[sel];save('st_memo_v1',memo);
  var c=document.querySelector('#cal .d[data-k="'+sel+'"]');if(c)c.classList.toggle('memo',!!memo[sel])});

/* ---------- 家計 ---------- */
var fin=load('st_fin_v1')||{};
var PAL=['#2563eb','#f97316','#16a34a','#a855f7','#e11d48','#0891b2','#ca8a04','#64748b'];
var groups=load('st_grp_v1')||[{id:'g1',n:'A',c:0},{id:'g2',n:'B',c:1},{id:'g3',n:'C',c:2}];
function grpSave(){save('st_grp_v1',groups)}
function gfind(id){for(var i=0;i<groups.length;i++)if(groups[i].id===id)return groups[i];return null}
function gcol(id){var g=gfind(id);return g?PAL[g.c%PAL.length]:''}
function renderGroups(){$('grpList').innerHTML=groups.map(function(g,i){return '<div class="grow" data-gi="'+i+'"><button class="gdot" data-gc="1" style="background:'+PAL[g.c%PAL.length]+'"></button><input type="text" class="gname" placeholder="グループ名(例: A銀行)" value="'+esc(g.n)+'"><button class="x" data-gdel="1">✕</button></div>'}).join('')||'<div class="info">グループはありません</div>'}
function gsHtml(n,c,b){var need=b.o-b.i;return '<div class="gs"><div class="gh"><span class="dot" style="background:'+c+'"></span><b>'+esc(n)+'</b><span class="need">'+(need>=0?'入金 ':'余り ')+yen(Math.abs(need))+'</span></div><div class="gd">支出 '+yen(b.o)+' / 収入 '+yen(b.i)+'</div></div>'}
function mk(y,m){return y+'-'+String(m+1).padStart(2,'0')}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function yen(n){return '¥'+Math.round(n).toLocaleString('ja-JP')}
function calc(e){
  e=String(e||'').normalize('NFKC').replace(/×/g,'*').replace(/÷/g,'/').replace(/[,円¥\s]/g,'');
  if(!e)return 0;
  if(!/^[0-9+\-*\/().]+$/.test(e)||/\/\/|\/\*|\*\//.test(e))return NaN;
  try{var r=Function('"use strict";return ('+e+')')();return isFinite(r)?Math.round(r):NaN}catch(x){return NaN}}
function finTotals(key){var i=0,o=0;(fin[key]||[]).forEach(function(x){if(x.k==='in')i+=x.a||0;else o+=x.a||0});return{i:i,o:o}}
function resText(x){var a=calc(x.e);return isNaN(a)?'⚠ 式が読み取れません':'= '+yen(a)}
function rowHtml(x,i){var gc=gcol(x.g);return '<div class="fr '+x.k+'" data-i="'+i+'"'+(gc?' style="border-left-color:'+gc+'"':'')+'><input type="text" class="nm" list="fnames" placeholder="項目名(例: 家族カード)" value="'+esc(x.n)+'">'+
  '<select class="gsel"><option value="">グループなし</option>'+groups.map(function(g){return '<option value="'+g.id+'"'+(x.g===g.id?' selected':'')+'>'+esc(g.n||'(名前なし)')+'</option>'}).join('')+'</select>'+
  '<input type="text" class="ex" placeholder="金額 例: 12800/2" value="'+esc(x.e)+'"><button class="mv" data-half="1">÷2</button><button class="x" data-del="1">✕</button><div class="res">'+resText(x)+'</div></div>'}
function finSum(){var key=mk(vy,vm),t=finTotals(key);$('s_in').textContent=yen(t.i);$('s_out').textContent=yen(t.o);
  var b=t.i-t.o;$('s_bal').textContent=yen(b);$('s_bal').style.color=b<0?'#dc2626':'';
  var m={},none={i:0,o:0},h='';
  (fin[key]||[]).forEach(function(x){var g=gfind(x.g),q=g?(m[g.id]=m[g.id]||{i:0,o:0}):none;if(x.k==='in')q.i+=x.a||0;else q.o+=x.a||0});
  groups.forEach(function(g){if(m[g.id])h+=gsHtml(g.n||'(名前なし)',PAL[g.c%PAL.length],m[g.id])});
  if(none.i||none.o)h+=gsHtml('グループなし','#9ca3af',none);
  $('grpSum').innerHTML=h||'<div class="info">項目にグループを選ぶと、ここにグループごとの合計が出ます</div>'}
function renderFin(){
  var key=mk(vy,vm),l=fin[key]||[],a='',b='';$('fmt').textContent=vy+'年'+(vm+1)+'月';
  l.forEach(function(x,i){if(x.k==='in')a+=rowHtml(x,i);else b+=rowHtml(x,i)});
  $('fin_in_l').innerHTML=a||'<div class="info">まだありません</div>';
  $('fin_out_l').innerHTML=b||'<div class="info">まだありません</div>';
  var seen={},o='';Object.keys(fin).forEach(function(k){fin[k].forEach(function(x){if(x.n&&!seen[x.n]){seen[x.n]=1;o+='<option value="'+esc(x.n)+'">'}})});
  $('fnames').innerHTML=o;renderGroups();finSum();
}
function finSave(){save('st_fin_v1',fin)}
$('pF').addEventListener('input',function(e){var gr=e.target.closest('.grow');if(gr){groups[+gr.dataset.gi].n=e.target.value;grpSave();return}
  var row=e.target.closest('.fr');if(!row)return;
  var x=fin[mk(vy,vm)][+row.dataset.i];
  if(e.target.classList.contains('gsel')){x.g=e.target.value;row.style.borderLeftColor=gcol(x.g);finSum();finSave();return}
  if(e.target.classList.contains('nm'))x.n=e.target.value;
  else{x.e=e.target.value;x.a=calc(x.e)||0;row.querySelector('.res').textContent=resText(x);finSum()}
  finSave()});
$('pF').addEventListener('click',function(e){var t=e.target,key=mk(vy,vm),d=t.dataset;
  if(d.gadd!=null){groups.push({id:'g'+Date.now(),n:'',c:groups.length%PAL.length});grpSave();renderFin();var gi=document.querySelectorAll('#grpList .gname');gi[gi.length-1].focus();return}
  var gr=t.closest('.grow');
  if(gr&&d.gc!=null){var g=groups[+gr.dataset.gi];g.c=(g.c+1)%PAL.length;grpSave();renderFin();return}
  if(gr&&d.gdel!=null){groups.splice(+gr.dataset.gi,1);grpSave();renderFin();return}
  if(d.add){(fin[key]=fin[key]||[]).push({k:d.add,n:'',e:'',a:0,g:''});finSave();renderFin();
    var r=$('fin_'+d.add+'_l').querySelectorAll('.nm');r[r.length-1].focus();return}
  var row=t.closest('.fr');
  if(row&&d.del){fin[key].splice(+row.dataset.i,1);finSave();renderFin();return}
  if(row&&d.half){var x=fin[key][+row.dataset.i],ex=(x.e||'').trim();if(!ex)return;
    x.e=/[+\-*\/×÷]/.test(ex)?'('+ex+')/2':ex+'/2';x.a=calc(x.e)||0;
    row.querySelector('.ex').value=x.e;row.querySelector('.res').textContent=resText(x);finSum();finSave();return}
  if(t.id==='fcopy'){var pk=vm===0?mk(vy-1,11):mk(vy,vm-1),src=fin[pk]||[];
    if(!src.length){alert('先月のデータがありません');return}
    if((fin[key]||[]).length&&!confirm('今月の項目に、先月の項目を追加しますか?'))return;
    fin[key]=(fin[key]||[]).concat(src.map(function(x){return{k:x.k,n:x.n,e:x.e,a:x.a,g:x.g||''}}));finSave();renderFin()}
});
$('pF').addEventListener('change',function(e){if(e.target.closest('.grow'))renderFin()});
$('fpm').onclick=function(){vm--;if(vm<0){vm=11;vy--}renderFin()};
$('fnm').onclick=function(){vm++;if(vm>11){vm=0;vy++}renderFin()};

bindOpts();renderSteps();setPhase('idle','待機中');idleView();
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}})}
</script>
</body>
